server:
  port: ${SERVER_PORT:8081}

springdoc:
  default-flat-param-object: true

spring:
  application:
    name: verdora-backend

  datasource:
    driver-class-name: ${DB_DRIVER}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [ email, profile ]
  jpa:
    open-in-view: false

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM}
  allowed-origins:
    - ${ALLOWED_ORIGIN_1:http://localhost:5173}
    - ${ALLOWED_ORIGIN_2:http://localhost:8081}
  sendgrid-api-key: ${SENDGRID_API_KEY}
  oauth2:
    redirect-uri: ${REDIRECT_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:3qzqVSvMGFVncul6arlN0Na0F/YcSbmJyvICg43Q2cQ=}
    access-expiration-ms: 900000 # 15 min
    refresh-expiration-ms: 604800000 # 7 days