name: CI

on:
  push:
    branches:
      - '**'        # any branch on push, including main
  pull_request:
    branches:
      - main        # when opening a PR into main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://localhost:5432/verdora_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: test-secret-key-for-ci-at-least-32-chars!!
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      REDIRECT_URL: http://localhost:5173
      SERVER_PORT: 8081

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: verdora_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn clean compile -B

      - name: Run tests
        run: mvn test -B

      - name: Package
        run: mvn package -DskipTests -B

      - name: Spotless check
        run: mvn spotless:check -B